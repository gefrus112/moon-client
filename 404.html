<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Moon Client</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .not-found h1 { font-size: clamp(4rem, 12vw, 7rem); }
    .not-found p { color: var(--muted); margin: 1rem 0 2rem; }
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <h1>🌙 <span class="grad-text">404</span></h1>
      <p>This page drifted into deep space. Let's get you back to Moon Client.</p>
      <a class="btn btn-primary btn-lg" href="./">Back to home</a>
    </div>
  </main>
</body>
</html>
